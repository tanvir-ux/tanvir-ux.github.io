name: Refresh GitHub activity
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write activity.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          raw = subprocess.check_output(
              ["gh", "api", "users/tanvir-ux/events/public?per_page=20"],
              text=True,
          )
          events = json.loads(raw)

          def title_for_pr(repo, num):
              if not num:
                  return ""
              try:
                  return subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/pulls/{num}", "--jq", ".title"],
                      text=True,
                  ).strip()
              except subprocess.CalledProcessError:
                  return ""

          items = []
          for ev in events:
              repo = (ev.get("repo") or {}).get("name") or ""
              p = ev.get("payload") or {}
              typ = ev.get("type")
              title = href = None
              if typ == "PullRequestEvent":
                  pr = p.get("pull_request") or {}
                  num = p.get("number") or pr.get("number")
                  pr_title = pr.get("title") or title_for_pr(repo, num)
                  action = "Merged" if (p.get("action") == "closed" and pr.get("merged")) else (p.get("action") or "updated")
                  title = f"{action} PR: {pr_title}".strip() if pr_title else f"{action} PR in {repo}" + (f" #{num}" if num else "")
                  href = pr.get("html_url") or (f"https://github.com/{repo}/pull/{num}" if num else f"https://github.com/{repo}")
              elif typ == "PushEvent":
                  ref = (p.get("ref") or "").replace("refs/heads/", "")
                  title = f"Pushed to {ref}" if ref else "Pushed commits"
                  href = f"https://github.com/{repo}" + (f"/commit/{p['head']}" if p.get("head") else "")
              elif typ == "IssueCommentEvent":
                  issue = p.get("issue") or {}
                  title = f"Commented on {issue.get('title') or repo}"
                  href = (p.get("comment") or {}).get("html_url") or issue.get("html_url") or f"https://github.com/{repo}"
              elif typ == "PullRequestReviewCommentEvent":
                  pr = p.get("pull_request") or {}
                  num = pr.get("number")
                  pr_title = pr.get("title") or title_for_pr(repo, num)
                  title = f"Commented on PR: {pr_title or repo}"
                  href = (p.get("comment") or {}).get("html_url") or pr.get("html_url") or f"https://github.com/{repo}"
              elif typ == "PullRequestReviewEvent":
                  pr = p.get("pull_request") or {}
                  num = pr.get("number")
                  pr_title = pr.get("title") or title_for_pr(repo, num)
                  title = f"Reviewed PR: {pr_title or repo}"
                  href = pr.get("html_url") or (f"https://github.com/{repo}/pull/{num}" if num else f"https://github.com/{repo}")
              elif typ == "CreateEvent":
                  title = f"Created {p.get('ref_type')} {p.get('ref') or ''}".strip()
                  href = f"https://github.com/{repo}"
              elif typ == "WatchEvent":
                  title = f"Starred {repo}"
                  href = f"https://github.com/{repo}"
              elif typ == "ForkEvent":
                  title = f"Forked {repo}"
                  href = f"https://github.com/{repo}"
              else:
                  continue
              items.append({
                  "title": title,
                  "href": href,
                  "repo": repo,
                  "created_at": ev.get("created_at"),
              })
              if len(items) >= 8:
                  break
          Path("activity.json").write_text(json.dumps({
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "items": items,
          }, indent=2) + "\n")
          PY
      - name: Commit if changed
        run: |
          git config user.name "tanvir-ux"
          git config user.email "tanviralamshuvo@gmail.com"
          git add activity.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Refresh GitHub activity feed"
          git push
